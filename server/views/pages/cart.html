<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — Emm Luxury Hair</title>
    <link rel="icon" href="/assets/EmmLuxuryHair.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <!--#header cart=link-->

    <!-- Main Content -->
    <main>
        <div class="cart-page">
            <h1>Your Bag</h1>
            <div class="cart-content">
                <div class="cart-items-section" id="cart-items-section">
                    <div class="loading">Loading cart...</div>
                </div>
                <div class="cart-summary">
                    <div class="cart-summary-inner">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="cart-subtotal">£0.00</span>
                        </div>

                        <div class="estimate-shipping">
                            <h3>Estimate shipping</h3>
                            <div class="form-group">
                                <label for="shipping-country">Country/region</label>
                                <select id="shipping-country" class="form-select">
                                    <option value="">Select country</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="shipping-province">Province</label>
                                <select id="shipping-province" class="form-select" disabled>
                                    <option value="">Select province</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="shipping-zip">Postal/ZIP code</label>
                                <input type="text" id="shipping-zip" class="form-input" placeholder="e.g. 7500">
                            </div>
                            <button id="calculate-shipping" class="btn btn-primary btn-block">CALCULATE</button>
                            <div id="shipping-rates" class="shipping-rates" style="display: none;">
                                <div class="shipping-rates-success">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="16" x2="12" y2="12"></line>
                                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                    </svg>
                                    <span id="shipping-rates-title">Shipping rates for your address:</span>
                                </div>
                                <ul id="shipping-rates-list"></ul>
                            </div>
                            <!-- Our published delivery prices, shown only when Shopify
                                 quoted nothing for the address above. A real rate from
                                 the shop always wins, so the two blocks never disagree. -->
                            <div id="shipping-estimate" class="shipping-estimate" style="display: none;">
                                <div class="shipping-estimate-head">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M1 3h13v13H1z"></path>
                                        <path d="M14 8h4l3 3v5h-7z"></path>
                                        <circle cx="5.5" cy="18.5" r="2.5"></circle>
                                        <circle cx="17.5" cy="18.5" r="2.5"></circle>
                                    </svg>
                                    <span id="shipping-estimate-title">Estimated delivery</span>
                                </div>
                                <ul id="shipping-estimate-list"></ul>
                                <p class="shipping-estimate-note" id="shipping-estimate-note"></p>
                            </div>
                            <div id="shipping-error" class="shipping-error" style="display: none;"></div>
                        </div>

                        <div class="summary-row">
                            <span>Shipping</span>
                            <span id="cart-shipping">Calculated at checkout</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span id="cart-total">£0.00</span>
                        </div>
                        <button class="btn btn-primary checkout-btn">Proceed to Checkout</button>
                        <a href="/" class="continue-shopping">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!--#footer-->
<script src="/js/api.js" defer></script>
    <script src="/js/shared.js" defer></script>
    <script src="/js/cart.js" defer></script>
    <script src="/js/cart-page.js" defer></script>
    <script src="/js/search.js" defer></script>
    <script src="/js/header-nav.js" defer></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
