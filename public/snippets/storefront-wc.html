<script src="https://cdn.shopify.com/storefront/web-components.js"></script>
<div id="shopify-wc-embed"></div>
<script>
(async function(){
  try{
    const res = await fetch('/api/config');
    const cfg = await res.json();
    const storeDomain = cfg.storeDomain;
    const publicToken = cfg.publicAccessToken;
    const container = document.getElementById('shopify-wc-embed');
    container.innerHTML = `
      <shopify-store id="store" store-domain="https://${storeDomain}" ${publicToken? `public-access-token="${publicToken}"` : ''}>
      </shopify-store>
    `;
  }catch(e){
    console.error('failed to init storefront wc', e);
  }
})();
</script>
